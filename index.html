    <script id="gh-root-redirect">
      // Tự động chuyển tiếp sang /docs/ nếu GitHub Pages được cấu hình chạy từ thư mục root chưa build
      if (typeof window !== 'undefined' && location.hostname.indexOf('github.io') !== -1 && location.pathname.indexOf('/docs') === -1) {
        var cleanPath = location.pathname.replace(/\/+$/, '');
        location.replace(cleanPath + '/docs/' + location.search + location.hash);
